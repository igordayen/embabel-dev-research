# Reload your embabel-agent JARs with the app
restart.include.embabel-agent-shell=/embabel-agent-shell-.*\.jar
restart.include.embabel-agent-shell-autoconfigure=/embabel-agent-shell-autoconfigure-.*\.jar
restart.include.embabel-agent-starter-shell=/embabel-agent-starter-shell-.*\.jar

# Force DevTools to reload ALL Spring Shell components
restart.include.spring-shell-core=org/springframework/shell/.*
restart.include.spring-shell-terminal=org/springframework/shell/terminal/.*
restart.include.jline=org/jline/.*
restart.include.jansi=org/fusesource/jansi/.*

# Reload your project classes and resources
restart.include.project=src/main/java
restart.include.resources=src/main/resources



